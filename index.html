<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KPE World — Screen Mirroring</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #05070d;
      --fg: #f2f5fa;
      --muted: #7d879c;
      --brand: #5b8def;
      --brand-2: #8b5cf6;
      --good: #4ec98a;
      --bad: #ef5b5b;
      --font: "Outfit", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
    }

    /* ---- Live video ------------------------------------------------------ */

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      opacity: 0;
      transition: opacity 400ms ease;
    }
    body.live #video { opacity: 1; }

    /* CAF requires this element in the DOM even though we never play a media
       item. Kept measurable rather than display:none, which CAF handles badly. */
    #castPlayer {
      position: fixed;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ---- Splash ---------------------------------------------------------- */

    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* TVs overscan; keep everything well inside the panel edges. */
      padding: 8vh 10vw;
      text-align: center;
      background: var(--bg);
      transition: opacity 500ms ease;
    }
    body.live #stage { opacity: 0; pointer-events: none; }

    /* Two slow-drifting colour washes. Transform-only so the TV's GPU can do it;
       animating gradients or large blurs stutters badly on Cast hardware. */
    .aurora {
      position: absolute;
      width: 80vw;
      height: 80vw;
      border-radius: 50%;
      opacity: 0.5;
      will-change: transform;
    }
    .aurora.a {
      background: radial-gradient(circle, rgba(91, 141, 239, 0.5) 0%, transparent 62%);
      animation: drift-a 22s ease-in-out infinite alternate;
    }
    .aurora.b {
      background: radial-gradient(circle, rgba(139, 92, 246, 0.42) 0%, transparent 62%);
      animation: drift-b 27s ease-in-out infinite alternate;
    }
    @keyframes drift-a {
      from { transform: translate3d(-22vw, -14vh, 0) scale(1); }
      to   { transform: translate3d(14vw, 10vh, 0) scale(1.25); }
    }
    @keyframes drift-b {
      from { transform: translate3d(20vw, 12vh, 0) scale(1.15); }
      to   { transform: translate3d(-16vw, -10vh, 0) scale(0.95); }
    }

    /* ---- Mark + signal rings --------------------------------------------- */

    .mark {
      position: relative;
      width: 15vh;
      height: 15vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4.5vh;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid var(--brand);
      opacity: 0;
      animation: pulse 3.2s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      will-change: transform, opacity;
    }
    .ring:nth-child(2) { animation-delay: 1.05s; }
    .ring:nth-child(3) { animation-delay: 2.1s; }
    @keyframes pulse {
      0%   { transform: scale(0.55); opacity: 0.65; }
      70%  { opacity: 0.12; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    /* Rings stop once mirroring is live — nothing is "waiting" any more. */
    body.connected .ring { animation-play-state: paused; opacity: 0; }

    .glyph {
      position: relative;
      width: 8.5vh;
      height: 8.5vh;
      color: var(--brand);
      filter: drop-shadow(0 0 1.6vh rgba(91, 141, 239, 0.55));
    }

    /* ---- Wordmark -------------------------------------------------------- */

    .wordmark {
      font-size: 7.2vh;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-indent: 0.16em;
      line-height: 1;
      background: linear-gradient(100deg, #ffffff 20%, var(--brand) 45%, var(--brand-2) 62%, #ffffff 85%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: shimmer 7s linear infinite;
    }
    @keyframes shimmer {
      from { background-position: 180% 0; }
      to   { background-position: -80% 0; }
    }

    .tagline {
      margin-top: 1.6vh;
      font-size: 2.3vh;
      font-weight: 300;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ---- Status ---------------------------------------------------------- */

    .status {
      display: flex;
      align-items: center;
      gap: 1.4vh;
      margin-top: 7vh;
      padding: 1.5vh 3.4vh;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
    }
    .status .dot {
      width: 1.3vh; height: 1.3vh;
      border-radius: 50%;
      background: var(--brand);
      animation: breathe 2s ease-in-out infinite;
    }
    .status.is-good .dot { background: var(--good); animation: none; }
    .status.is-bad .dot  { background: var(--bad);  animation: none; }
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.75); }
    }
    .status .label { font-size: 2.6vh; font-weight: 500; }

    .hint {
      margin-top: 3vh;
      max-width: 62ch;
      font-size: 2vh;
      font-weight: 300;
      line-height: 1.6;
      color: var(--muted);
    }

    /* Entrance */
    .rise { animation: rise 900ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
    .rise.d1 { animation-delay: 120ms; }
    .rise.d2 { animation-delay: 240ms; }
    .rise.d3 { animation-delay: 360ms; }
    @keyframes rise {
      from { opacity: 0; transform: translate3d(0, 3vh, 0); }
      to   { opacity: 1; transform: none; }
    }

    /* ---- Diagnostics (off unless ?debug=1) ------------------------------- */

    #log {
      position: fixed;
      left: 2vw; bottom: 2vh;
      max-width: 60vw; max-height: 32vh;
      overflow: hidden;
      margin: 0;
      font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
      white-space: pre-wrap;
      pointer-events: none;
      text-shadow: 0 1px 2px #000;
      z-index: 10;
    }
    #log[hidden] { display: none; }
    #log b { color: var(--brand); font-weight: 500; }
    #log .bad { color: var(--bad); }

    @media (prefers-reduced-motion: reduce) {
      .aurora, .ring, .wordmark, .status .dot, .rise { animation: none; }
      .wordmark { -webkit-text-fill-color: var(--fg); color: var(--fg); }
    }
  </style>
</head>
<body>
  <cast-media-player id="castPlayer"></cast-media-player>

  <video id="video" autoplay muted playsinline></video>

  <div id="stage">
    <div class="aurora a"></div>
    <div class="aurora b"></div>

    <div class="mark rise">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <svg class="glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="4" y="8" width="40" height="27" rx="4"
              stroke="currentColor" stroke-width="3" />
        <path d="M18 41h12" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
        <path d="M13 28a9 9 0 0 1 9 9" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" fill="none" />
        <path d="M13 21a16 16 0 0 1 16 16" stroke="currentColor" stroke-width="3"
              stroke-linecap="round" fill="none" opacity="0.55" />
        <circle cx="13.5" cy="36.5" r="1.8" fill="currentColor" />
      </svg>
    </div>

    <div class="wordmark rise d1">KPE WORLD</div>
    <div class="tagline rise d1">Screen Mirroring</div>

    <div class="status rise d2" id="status">
      <span class="dot"></span>
      <span class="label" id="statusLabel">Ready to connect</span>
    </div>

    <p class="hint rise d3" id="hint">
      Open <strong>WallCast</strong> on your iPhone, choose this TV, then tap Start Mirroring.
    </p>
  </div>

  <pre id="log" hidden></pre>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    (function () {
      'use strict';

      // Must match GoogleCastBridge.streamNamespace on the iOS side.
      const NAMESPACE = 'urn:x-cast:com.mirror.everything.stream';

      // Diagnostics are off by default so the TV stays clean; add ?debug=1 to bring
      // the log back when something needs investigating.
      const showLog = new URLSearchParams(location.search).get('debug') === '1';

      const body = document.body;
      const video = document.getElementById('video');
      const statusEl = document.getElementById('status');
      const statusLabel = document.getElementById('statusLabel');
      const hintEl = document.getElementById('hint');
      const logEl = document.getElementById('log');

      logEl.hidden = !showLog;

      const lines = [];
      function log(message, isError) {
        const stamp = new Date().toISOString().substr(11, 8);
        lines.push('<b>' + stamp + '</b> ' +
          (isError ? '<span class="bad">' + message + '</span>' : message));
        if (lines.length > 14) lines.shift();
        if (showLog) logEl.innerHTML = lines.join('\n');
        (isError ? console.error : console.log)('[receiver]', message);
      }

      /**
       * @param {'idle'|'busy'|'live'|'error'} state
       */
      function setState(state, label, hint) {
        statusEl.classList.toggle('is-good', state === 'live');
        statusEl.classList.toggle('is-bad', state === 'error');
        body.classList.toggle('live', state === 'live');
        body.classList.toggle('connected', state === 'live' || state === 'busy');
        if (label) statusLabel.textContent = label;
        if (hint !== undefined) hintEl.innerHTML = hint;
      }

      let pc = null;

      function teardown() {
        if (!pc) return;
        try { pc.close(); } catch (_) {}
        pc = null;
        video.srcObject = null;
      }

      /**
       * The phone sends one complete SDP offer — non-trickle, so every ICE candidate is
       * already inside it — and we answer the same way. Media then flows peer-to-peer over
       * the local network, never through Google's servers or this page's host.
       *
       * WebRTC is what makes this work from an HTTPS page: a peer connection is exempt from
       * the mixed-content rule that blocks ws:// to a LAN address, and its DTLS uses
       * self-signed certificates, so there is no certificate to obtain.
       */
      async function handleOffer(sdp) {
        teardown();
        setState('busy', 'Connecting…', 'Negotiating with your iPhone.');
        log('offer received (' + sdp.length + ' bytes)');

        pc = new RTCPeerConnection({ iceServers: [] });

        pc.ontrack = function (event) {
          log('track received: ' + event.track.kind);
          video.srcObject = event.streams[0];
          video.play().catch(function (err) {
            log('video.play() rejected: ' + err.message, true);
          });
        };

        pc.oniceconnectionstatechange = function () {
          if (!pc) return;
          const state = pc.iceConnectionState;
          log('ice: ' + state, state === 'failed');
          if (state === 'connected' || state === 'completed') {
            setState('live', 'Mirroring');
          } else if (state === 'failed') {
            setState('error', 'Connection failed',
              'Your iPhone and this TV could not reach each other. Check they are on the same Wi-Fi network.');
          } else if (state === 'disconnected' || state === 'closed') {
            setState('idle', 'Ready to connect',
              'Open <strong>WallCast</strong> on your iPhone, choose this TV, then tap Start Mirroring.');
          }
        };

        await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);

        // Wait for gathering so the answer carries every candidate in one message.
        if (pc.iceGatheringState !== 'complete') {
          await new Promise(function (resolve) {
            const done = function () {
              if (!pc || pc.iceGatheringState === 'complete') {
                if (pc) pc.removeEventListener('icegatheringstatechange', done);
                resolve();
              }
            };
            pc.addEventListener('icegatheringstatechange', done);
            setTimeout(resolve, 2000); // never hang on a stalled gather
          });
        }

        log('answer ready');
        return pc.localDescription.sdp;
      }

      // ---- Cast wiring ------------------------------------------------------

      if (!window.cast || !cast.framework) {
        setState('error', 'Receiver SDK failed to load',
          'Check this page is served over HTTPS and the TV has internet access.');
        log('CAF receiver SDK unavailable', true);
        return;
      }

      // The SDK loads in an ordinary browser too, it just has no Cast device to talk to
      // (hence the failed localhost:8008 attempts in the console). Cast hardware puts
      // "CrKey" in the user agent, so use that to tell them apart.
      if (!/\bCrKey\b/.test(navigator.userAgent)) {
        setState('idle', 'Preview mode',
          'This page is a Cast receiver. Hosting is working — it mirrors once a Cast device loads it.');
        log('not running on Cast hardware — preview mode');
      }

      const context = cast.framework.CastReceiverContext.getInstance();

      context.addCustomMessageListener(NAMESPACE, function (event) {
        let message = event.data;
        if (typeof message === 'string') {
          try {
            message = JSON.parse(message);
          } catch (err) {
            log('bad message: ' + err.message, true);
            return;
          }
        }
        if (!message || message.type !== 'OFFER' || !message.sdp) {
          log('ignoring message type: ' + (message && message.type));
          return;
        }

        handleOffer(message.sdp).then(function (answerSdp) {
          context.sendCustomMessage(NAMESPACE, event.senderId, {
            type: 'ANSWER',
            sdp: answerSdp,
          });
          log('answer sent to sender ' + event.senderId);
        }).catch(function (err) {
          log('negotiation failed: ' + err.message, true);
          setState('error', 'Could not start mirroring', err.message);
        });
      });

      context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, function () {
        log('sender disconnected');
        teardown();
        setState('idle', 'Ready to connect',
          'Open <strong>WallCast</strong> on your iPhone, choose this TV, then tap Start Mirroring.');
      });

      // We stream live frames rather than playing a media item, so the built-in player UI
      // is unused and the idle timeout must not tear the session down.
      const options = new cast.framework.CastReceiverOptions();
      options.disableIdleTimeout = true;
      options.customNamespaces = {};
      options.customNamespaces[NAMESPACE] = cast.framework.system.MessageType.JSON;

      try {
        context.start(options);
        log('receiver started, listening on ' + NAMESPACE);
      } catch (err) {
        log('context.start() failed: ' + err.message, true);
        setState('error', 'Receiver failed to start', err.message);
      }
    })();
  </script>
</body>
</html>
